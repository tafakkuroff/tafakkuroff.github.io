<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tafakkur — o'quvchilar maqolalari</title>
<meta name="description" content="Tafakkur: o'zbek tilidagi maqolalar, kitoblar va o'quvchilar jamoasi. O'z maqolangizni yozing, o'qing va ball to'plang.">
<style>
:root{--bg:#FBF7EE;--card:#fff;--fg:#141414;--muted:#5B5B52;--g:#1F4D3A;--g2:#E6EFE8;--line:#E3DCCB;--red:#8A2B2B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.7 Georgia,'Times New Roman',serif}
.w{max-width:720px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--g);padding:10px 0;margin-bottom:18px}
header a.logo{color:var(--g);font-weight:700;font-size:27px;text-decoration:none}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .5em}
h2{font-size:23px;color:var(--g);margin:1.4em 0 .4em}
a{color:var(--g)}
p{margin:.7em 0}
.m{color:var(--muted);font-size:15px;font-family:system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;display:block;color:var(--fg);text-decoration:none}
.card b{display:block;color:var(--g);font-size:21px;margin:3px 0}
.tag{display:inline-block;background:var(--g2);color:var(--g);padding:2px 11px;border-radius:99px;font:14px system-ui,sans-serif}
.book{border-left:5px solid var(--g)}
button,.btn{font:600 16px system-ui,sans-serif;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
button.o,.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}
button.r{background:var(--red)}
button:disabled{opacity:.5}
input,textarea,select{width:100%;font:17px system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);margin:5px 0 12px}
textarea{min-height:260px;font-family:Georgia,serif;font-size:18px;line-height:1.6}
label{font:600 15px system-ui,sans-serif;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--g);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:720px}
nav a{flex:1;text-align:center;padding:10px 2px;font:600 13px system-ui,sans-serif;color:var(--muted);text-decoration:none}
nav a.on{color:var(--g);border-top:3px solid var(--g);margin-top:-2px}
nav a span{display:block;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--g);color:var(--g);padding:5px 13px;border-radius:99px;font:15px system-ui,sans-serif;cursor:pointer;background:transparent}
.chip.on{background:var(--g);color:#fff}
.av{font-size:46px;line-height:1}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;background:var(--g2);border-radius:12px;padding:10px;text-align:center;font:14px system-ui,sans-serif;color:var(--g)}.stat b{display:block;font-size:26px}
.body p{margin:1em 0}
.err{color:var(--red);font:15px system-ui,sans-serif}
.box{background:var(--g2);border-radius:12px;padding:12px 16px;margin:14px 0}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.rank .n{width:26px;font:700 16px system-ui;color:var(--g)}.rank .x{flex:1}.rank .v{font:600 15px system-ui;color:var(--g)}
</style></head><body>
<div class="w" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL="https://przuqqhiqirbfdioynhj.supabase.co", SUPA_KEY="sb_publishable_3Bin_uIWkbEtFjyXL-XiUw_0LL2TbYC";
const CATS=["Tarix","Adabiyot","Fan","Texnologiya","Iqtisodiyot","Jamiyat","Boshqa"];
const AVS=["🙂","📚","🦉","🐪","🌿","✍️","🔭","🎓","🧠","🌙","🏔️","🕌"];
const app=document.getElementById("app"), navEl=document.getElementById("nav");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paras=t=>esc(t).split(/\n{2,}|\n/).filter(x=>x.trim()).map(x=>`<p>${x}</p>`).join("");
const dt=s=>s?new Date(s).toLocaleDateString("uz-UZ"):"";
if(SUPA_URL.startsWith("PASTE")){app.innerHTML='<h1>Tafakkur</h1><div class="box">Sayt hali Supabase bilan ulanmagan. SUPA_URL va SUPA_KEY ni to\'ldiring.</div>';throw 0}
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let me=null, prof=null;
async function loadMe(){const {data:{session}}=await sb.auth.getSession();me=session?.user||null;prof=null;
 if(me){const {data}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();prof=data}}
function nav(){const h=location.hash||"#/";const it=[["#/","📖","Maqolalar"],["#/books","📚","Kitoblar"],["#/write","✍️","Yozish"],["#/lib","🔖","Kutubxona"],["#/top","🏆","Reyting"],["#/me","👤","Profil"]];
 navEl.innerHTML=it.map(([a,i,t])=>`<a href="${a}" class="${h===a||(a!="#/"&&h.startsWith(a))?"on":""}"><span>${i}</span>${t}</a>`).join("")}
const head=()=>`<header><a class="logo" href="#/">Tafakkur</a>${me?`<span class="m">${esc(prof?.full_name||me.email)}</span>`:`<a class="btn o" href="#/login">Kirish</a>`}</header>`;
const view=h=>{nav();app.innerHTML=head()+h};
const needLogin=()=>view('<h1>Kirish kerak</h1><p>Bu bo\'lim uchun avval tizimga kiring.</p><a class="btn" href="#/login">Kirish / Ro\'yxatdan o\'tish</a>');

async function home(cat){
 view('<h1>Maqolalar</h1><p class="m">Yuklanmoqda…</p>');
 let q=sb.from("article_stats").select("*").order("published_at",{ascending:false}).limit(60);
 if(cat)q=q.eq("category",cat);
 const {data:st}=await q;const ids=(st||[]).map(x=>x.author_id);
 const {data:ps}=ids.length?await sb.from("profiles").select("id,full_name,avatar").in("id",ids):{data:[]};
 const pm=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 let rec="";
 if(prof?.interests?.length&&!cat){const r=(st||[]).filter(a=>prof.interests.includes(a.category)).slice(0,3);
  if(r.length)rec='<h2>Siz uchun</h2>'+r.map(card(pm)).join("")}
 view(`<h1>Maqolalar</h1><div class="row"><span class="chip ${!cat?"on":""}" onclick="location.hash='#/'">Hammasi</span>${CATS.map(c=>`<span class="chip ${cat===c?"on":""}" onclick="location.hash='#/c/${c}'">${c}</span>`).join("")}</div>${rec}${rec?"<h2>Yangilari</h2>":""}${(st||[]).map(card(pm)).join("")||'<p class="m">Hozircha maqola yo\'q. Birinchi bo\'ling: «Yozish» bo\'limiga kiring.</p>'}`);
}
const card=pm=>a=>`<a class="card" href="#/a/${a.article_id}"><span class="tag">${esc(a.category)}</span><b>${esc(a.title)}</b><span class="m">${esc(pm[a.author_id]?.avatar||"")} ${esc(pm[a.author_id]?.full_name||"Muallif")} · ${dt(a.published_at)} · 👁 ${a.views}</span></a>`;

async function article(id){
 view('<p class="m">Yuklanmoqda…</p>');
 const {data:a}=await sb.from("articles").select("*").eq("id",id).maybeSingle();
 if(!a){view("<h1>Maqola topilmadi</h1>");return}
 const {data:au}=await sb.from("profiles").select("id,full_name,avatar").eq("id",a.author_id).maybeSingle();
 if(a.status==="published")await sb.rpc("register_view",{aid:id});
 const {data:s}=await sb.from("article_stats").select("views,points").eq("article_id",id).maybeSingle();
 let saved=false;if(me){const {data}=await sb.from("saves").select("item_id").eq("user_id",me.id).eq("kind","article").eq("item_id",id).maybeSingle();saved=!!data}
 view(`<span class="tag">${esc(a.category)}</span>${a.status!=="published"?` <span class="tag">${a.status==="pending"?"Tekshiruvda":"Rad etilgan"}</span>`:""}<h1>${esc(a.title)}</h1>
 <p class="m"><a href="#/u/${au?.id}">${esc(au?.avatar||"")} ${esc(au?.full_name||"Muallif")}</a> · ${dt(a.published_at||a.created_at)}${s?` · 👁 ${s.views} ko'rish`:""}</p>
 <div class="body">${paras(a.body)}</div>
 ${a.note?`<div class="box"><b>Tahrirchi izohi:</b> ${esc(a.note)}</div>`:""}
 <div class="row">${me&&a.status==="published"?`<button id="sv" class="${saved?"o":""}">${saved?"✓ Saqlangan":"🔖 Saqlash"}</button>`:""}${me&&(a.author_id===me.id||prof?.is_admin)?`<button class="r" id="del">O'chirish</button>`:""}</div>`);
 const sv=document.getElementById("sv");if(sv)sv.onclick=async()=>{if(saved)await sb.from("saves").delete().eq("user_id",me.id).eq("kind","article").eq("item_id",id);else await sb.from("saves").insert({user_id:me.id,kind:"article",item_id:id});article(id)};
 const d=document.getElementById("del");if(d)d.onclick=async()=>{if(confirm("Maqola o'chirilsin? Uning ko'rishlari va ballari ham o'chadi.")){await sb.from("articles").delete().eq("id",id);location.hash="#/me"}};
}

async function write(){
 if(!me)return needLogin();
 view(`<h1>Maqola yozish</h1><p class="m">Maqolangiz tahririyat tekshiruvidan o'tgach, sizning ismingiz bilan e'lon qilinadi.</p>
 <label>Sarlavha</label><input id="t" maxlength="150"><label>Bo'lim</label><select id="c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Matn (kamida 200 belgi). Abzatslarni bo'sh qator bilan ajrating.</label><textarea id="b"></textarea><p class="err" id="e"></p><button id="go">Tekshiruvga yuborish</button>`);
 document.getElementById("go").onclick=async()=>{const t=title(),b=document.getElementById("b").value.trim(),e=document.getElementById("e");
  function title(){return document.getElementById("t").value.trim()}
  if(t.length<5||b.length<200){e.textContent="Sarlavha kamida 5, matn kamida 200 belgi bo'lsin.";return}
  const {error}=await sb.from("articles").insert({author_id:me.id,title:t,body:b,category:document.getElementById("c").value});
  if(error){e.textContent="Xato: "+error.message;return}location.hash="#/me"};
}

async function login(){
 view(`<h1>Kirish</h1><label>Ism va familiya (faqat ro'yxatdan o'tishda)</label><input id="n"><label>Email</label><input id="em" type="email"><label>Parol (kamida 6 belgi)</label><input id="pw" type="password"><p class="err" id="e"></p>
 <div class="row"><button id="in">Kirish</button><button class="o" id="up">Ro'yxatdan o'tish</button></div>`);
 const e=document.getElementById("e");
 document.getElementById("in").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)e.textContent="Xato: "+error.message;else{await loadMe();location.hash="#/me"}};
 document.getElementById("up").onclick=async()=>{if(n.value.trim().length<3){e.textContent="Ism va familiyani yozing.";return}
  const {data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{full_name:n.value.trim()}}});
  if(error){e.textContent="Xato: "+error.message;return}
  if(!data.session){e.textContent="Emailingizga tasdiqlash xati yuborildi. Tasdiqlab, keyin kiring.";return}
  await loadMe();location.hash="#/me"};
}

function ach(n,pts,reads,pub){const a=[];if(pub>=1)a.push("✍️ Birinchi maqola");if(pub>=5)a.push("📝 5 ta maqola");if(pts>=10)a.push("⭐ 10 ball");if(pts>=50)a.push("🏅 50 ball");if(reads>=10)a.push("📖 10 maqola o'qigan");if(reads>=50)a.push("🎓 50 maqola o'qigan");return a}
async function profile(uid){
 const own=!uid||(me&&uid===me.id);
 if(own&&!me)return login();
 view('<p class="m">Yuklanmoqda…</p>');
 const id=own?me.id:uid;
 const {data:p}=await sb.from("profiles").select("*").eq("id",id).maybeSingle();
 if(!p){view("<h1>Foydalanuvchi topilmadi</h1>");return}
 const {data:st}=await sb.from("article_stats").select("*").eq("author_id",id).order("published_at",{ascending:false});
 const pts=(st||[]).reduce((s,a)=>s+a.points,0), pub=(st||[]).length, vw=(st||[]).reduce((s,a)=>s+a.views,0);
 let reads=0;if(own){const {data}=await sb.rpc("my_reads");reads=data||0}
 let mine="";if(own){const {data}=await sb.from("articles").select("id,title,status,created_at,note").eq("author_id",id).neq("status","published").order("created_at",{ascending:false});
  mine=(data&&data.length)?'<h2>Tekshiruvdagi / rad etilgan</h2>'+data.map(a=>`<a class="card" href="#/a/${a.id}"><b>${esc(a.title)}</b><span class="m">${a.status==="pending"?"⏳ Tekshiruvda":"❌ Rad etilgan"}${a.note?" — "+esc(a.note):""}</span></a>`).join(""):""}
 const ac=ach(p.full_name,pts,reads,pub);
 const {data:sh}=await sb.from("shelf").select("*").eq("user_id",id).order("created_at",{ascending:false});const psv=await mySaved();
 view(`<div class="av">${esc(p.avatar)}</div><h1>${esc(p.full_name)}</h1>${p.bio?`<p>${esc(p.bio)}</p>`:""}
 ${p.interests?.length?`<div class="row">${p.interests.map(i=>`<span class="tag">${esc(i)}</span>`).join("")}</div>`:""}
 <div class="stat"><div><b>${pts}</b>ball</div><div><b>${pub}</b>maqola</div><div><b>${vw}</b>ko'rish</div>${own?`<div><b>${reads}</b>o'qigan</div>`:""}</div>
 ${ac.length?`<h2>Yutuqlar</h2><div class="row">${ac.map(x=>`<span class="tag">${x}</span>`).join("")}</div>`:""}
 <h2>Maqolalari</h2>${(st||[]).map(a=>`<a class="card" href="#/a/${a.article_id}"><span class="tag">${esc(a.category)}</span><b>${esc(a.title)}</b><span class="m">👁 ${a.views} · ${a.points} ball</span></a>`).join("")||'<p class="m">Hali e\'lon qilingan maqola yo\'q.</p>'}
 <h2>Javonim</h2>${(sh||[]).map(k=>shelfCard(k,{[id]:p},psv)).join("")||'<p class="m">Javonda hali kitob yo\'q.</p>'}${own?'<a class="btn" href="#/books/add">➕ Javonga kitob qo\'shish</a>':""}
 ${mine}${own?`<h2>Profilni tahrirlash</h2>
 <label>Ism va familiya</label><input id="fn" value="${esc(p.full_name)}"><label>Avatar</label><div class="row">${AVS.map(a=>`<span class="chip ${a===p.avatar?"on":""}" data-av="${a}">${a}</span>`).join("")}</div>
 <label>O'zi haqida</label><textarea id="bio" style="min-height:90px;font-family:system-ui">${esc(p.bio)}</textarea>
 <label>Qiziqishlari</label><div class="row">${CATS.map(c=>`<span class="chip ${p.interests?.includes(c)?"on":""}" data-in="${c}">${c}</span>`).join("")}</div>
 <div class="row"><button id="sv">Saqlash</button>${prof?.is_admin?'<a class="btn o" href="#/admin">Tahririyat</a>':""}<button class="o" id="out">Chiqish</button></div><p class="m" id="ok"></p>`:""}`);
 if(own){let av=p.avatar;document.querySelectorAll("[data-av]").forEach(el=>el.onclick=()=>{av=el.dataset.av;document.querySelectorAll("[data-av]").forEach(x=>x.classList.toggle("on",x===el))});
  document.querySelectorAll("[data-in]").forEach(el=>el.onclick=()=>el.classList.toggle("on"));
  bindShelf(psv,()=>profile(uid));
  document.getElementById("sv").onclick=async()=>{const ints=[...document.querySelectorAll("[data-in].on")].map(x=>x.dataset.in);
   const {error}=await sb.from("profiles").update({full_name:fn.value.trim(),avatar:av,bio:bio.value.trim(),interests:ints}).eq("id",me.id);
   document.getElementById("ok").textContent=error?"Xato: "+error.message:"Saqlandi ✓";await loadMe()};
  document.getElementById("out").onclick=async()=>{await sb.auth.signOut();await loadMe();location.hash="#/"}}
}

const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
function shelfCard(k,pm,sv,mine){const p=pm[k.user_id]||{};
 return `<div class="card book">${k.cover_url?`<img src="${esc(k.cover_url)}" alt="" loading="lazy" style="width:100%;max-height:340px;object-fit:contain;background:#f1ecdf;border-radius:10px;margin-bottom:8px">`:""}
 <b>${esc(k.title)}</b><span class="m">${esc(k.author)}</span><div style="color:var(--g);font-size:22px;letter-spacing:2px">${stars(k.stars)}</div>
 <p style="margin:6px 0"><span class="m">Bu kitob menga nima berdi:</span><br>${esc(k.review)}</p>
 <span class="m"><a href="#/u/${k.user_id}">${esc(p.avatar||"")} ${esc(p.full_name||"O'quvchi")}</a> · ${dt(k.created_at)}</span>
 <div class="row">${me&&sv?`<button data-b="${k.id}" class="${sv.has(k.id)?"o":""}">${sv.has(k.id)?"✓ Saqlangan":"🔖 Saqlash"}</button>`:""}${me&&(k.user_id===me.id||prof?.is_admin)?`<button class="r" data-db="${k.id}" data-img="${esc(k.cover_url||"")}">O'chirish</button>`:""}</div></div>`}
function bindShelf(sv,reload){
 document.querySelectorAll("[data-b]").forEach(el=>el.onclick=async()=>{const id=el.dataset.b;if(sv.has(id))await sb.from("saves").delete().eq("user_id",me.id).eq("kind","book").eq("item_id",id);else await sb.from("saves").insert({user_id:me.id,kind:"book",item_id:id});reload()});
 document.querySelectorAll("[data-db]").forEach(el=>el.onclick=async()=>{if(!confirm("Kitob o'chirilsinmi?"))return;
  await sb.from("shelf").delete().eq("id",el.dataset.db);
  const m=(el.dataset.img||"").split("/covers/")[1];if(m)await sb.storage.from("covers").remove([m]);reload()})}
async function mySaved(){if(!me)return new Set();const {data}=await sb.from("saves").select("item_id").eq("user_id",me.id).eq("kind","book");return new Set((data||[]).map(x=>x.item_id))}
async function books(){
 view('<p class="m">Yuklanmoqda…</p>');
 const {data:b}=await sb.from("shelf").select("*").order("created_at",{ascending:false}).limit(60);
 const ids=[...new Set((b||[]).map(x=>x.user_id))];
 const {data:ps}=ids.length?await sb.from("profiles").select("id,full_name,avatar").in("id",ids):{data:[]};
 const pm=Object.fromEntries((ps||[]).map(p=>[p.id,p]));const sv=await mySaved();
 view(`<h1>Kitoblar</h1><p class="m">O'quvchilarning javonidagi kitoblar. Har biri nima bergani va baholari bilan.</p>
 <a class="btn" href="#/books/add">➕ Javonimga kitob qo'shish</a>
 ${(b||[]).map(k=>shelfCard(k,pm,sv)).join("")||'<p class="m">Hozircha kitob yo\'q. Birinchi bo\'ling!</p>'}`);
 bindShelf(sv,books);
}
async function addBook(){
 if(!me)return needLogin();
 view(`<h1>Javonimga kitob</h1><label>Kitob nomi</label><input id="bt" maxlength="120"><label>Muallifi</label><input id="ba" maxlength="80">
 <label>Kitob rasmi (muqovasi)</label><input id="bf" type="file" accept="image/*"><img id="pv" style="display:none;max-width:60%;border-radius:10px;margin-bottom:10px">
 <label>Sizga yoqdimi? Yulduzcha bering</label><div class="row" id="st" style="font-size:34px;color:var(--g);cursor:pointer;gap:4px">${[1,2,3,4,5].map(i=>`<span data-s="${i}">☆</span>`).join("")}</div>
 <label>Bu kitob sizga nima berdi? (kamida 20 belgi)</label><textarea id="br" style="min-height:140px"></textarea>
 <p class="err" id="e"></p><button id="go">Javonga qo'yish</button>`);
 let star=0;const paint=()=>document.querySelectorAll("#st [data-s]").forEach(x=>x.textContent=+x.dataset.s<=star?"★":"☆");
 document.querySelectorAll("#st [data-s]").forEach(x=>x.onclick=()=>{star=+x.dataset.s;paint()});
 let blob=null;
 document.getElementById("bf").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
  const sc=Math.min(1,520/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.7));
  const pv=document.getElementById("pv");pv.src=URL.createObjectURL(blob);pv.style.display="block"};
 document.getElementById("go").onclick=async()=>{const e=document.getElementById("e"),t=bt.value.trim(),a=ba.value.trim(),r=br.value.trim();
  if(t.length<2||a.length<2){e.textContent="Kitob nomi va muallifini yozing.";return}
  if(!blob){e.textContent="Kitob rasmini tanlang.";return}
  if(!star){e.textContent="Yulduzcha bering (1–5).";return}
  if(r.length<20){e.textContent="Kitob sizga nima bergani haqida kamida 20 belgi yozing.";return}
  const btn=document.getElementById("go");btn.disabled=true;e.textContent="Yuklanmoqda…";
  const path=`${me.id}/${Date.now()}.jpg`;
  const up=await sb.storage.from("covers").upload(path,blob,{contentType:"image/jpeg"});
  if(up.error){e.textContent="Rasm yuklanmadi: "+up.error.message;btn.disabled=false;return}
  const url=sb.storage.from("covers").getPublicUrl(path).data.publicUrl;
  const {error}=await sb.from("shelf").insert({user_id:me.id,title:t,author:a,cover_url:url,stars:star,review:r});
  if(error){e.textContent="Xato: "+error.message;btn.disabled=false;return}
  location.hash="#/books"};
}

`);

async function route(){
 const h=location.hash||"#/";let m;
 try{
  if(h==="#/")return home();
  if(m=h.match(/^#\/c\/(.+)$/))return home(decodeURIComponent(m[1]));
  if(m=h.match(/^#\/a\/(.+)$/))return article(m[1]);
  if(m=h.match(/^#\/u\/(.+)$/))return profile(m[1]);
  if(h==="#/write")return write();if(h==="#/login")return login();if(h==="#/me")return profile();
  if(h==="#/books/add")return addBook();if(h==="#/books")return books();if(h==="#/lib")return lib();if(h==="#/top")return topPage();if(h==="#/admin")return admin();
  home();
 }catch(e){view('<p class="err">Xatolik: '+esc(e.message||e)+'</p>')}
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
sb.auth.onAuthStateChange(()=>{});
loadMe().then(route);
</script></body></html>
